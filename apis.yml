name: Airhelp
description: >-
  AirHelp is a passenger-rights platform that helps air travelers claim
  compensation for delayed, cancelled, and overbooked flights under regulations
  such as EU 261, UK 261, and similar laws worldwide. It handles the full claims
  process on a "no win, no fee" basis, managing paperwork, airline negotiations,
  and legal escalation on the passenger's behalf, and offers an AirHelp+
  membership adding fast-track claims, flight-disruption assistance, and airport
  lounge access. AirHelp operates a consumer web funnel and mobile apps plus a
  network of travel-brand, corporate, and affiliate partnerships, but does not
  publish a public developer API, developer portal, or client SDKs; its GitHub
  organization hosts internal engineering tooling rather than API client
  libraries. This profile was seeded as a Y Combinator portfolio company and
  enriched by the API Evangelist pipeline from AirHelp's public web surface.
